{% extends "base.html" %}
{% block title %}Log in{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4 mt-5">
      <h4 class="mb-1">Fraud Detection System</h4>
      <p class="text-muted small mb-4">Sign in to score and review transactions.</p>

      <form method="post">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input name="username" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input name="password" type="password" class="form-control" required>
        </div>
        <button class="btn btn-dark w-100">Log in</button>
      </form>

      <hr class="my-4">
      <p class="small text-muted mb-1">
        No account? <a href="{{ url_for('register') }}">Register</a>
      </p>
      <p class="small text-muted mb-0">
        Demo credentials: <code>admin</code> / <code>admin123</code>
      </p>
    </div>
  </div>
</div>
{% endblock %}
